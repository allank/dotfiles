# set prefix
unbind C-b
set -g prefix C-s

# send C-s to OS
bind-key -r C-s send-prefix

# pane navigation without prefix
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

# window navigation
bind -n M-n select-window -n
bind -n M-p select-window -p

# create a new session (prompts for a name)
bind-key N command-prompt -p "New session name:" "new-session -s '%%'"

# display all the colors
set-option -g default-terminal "tmux-256color"
# don't use vim keys in command mode
set-option -g status-keys "emacs"

# pass through extended key sequences (e.g. shift+enter) instead of collapsing them
set-option -g extended-keys on
set-option -as terminal-features "xterm*:extkeys"

# mouse: wheel scrolls into copy-mode, drag selects
set-option -g mouse on

# vi-style copy-mode: j/k to scroll, v to select, y to yank
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Catppuccin Mocha theme
set-option -g status-bg "#1e1e2e"
set-option -g status-fg "#cdd6f4"
set-option -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set-option -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e"
set-option -g window-status-style "bg=#313244,fg=#cdd6f4"
set-option -g pane-border-style "fg=#6c7086"
set-option -g pane-active-border-style "fg=#89b4fa"

bind-key % split-window -h -c "#{pane_current_path}"
bind-key \" split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "${pane_current_path}"

set-option -g status-left-length 50
set-option -g status-right " #(date '+%a %d %b %H:%M') "

set-option -g base-index 1
set-option -g renumber-windows on

# break current pane into new windows
bind-key b break-pane -d

# choose session
bind-key C-j choose-tree

# when the session you're attached to is destroyed (e.g. its last window
# closed), switch to another running session instead of detaching to the
# shell; only detach if no other sessions are left
set-option -g detach-on-destroy off
