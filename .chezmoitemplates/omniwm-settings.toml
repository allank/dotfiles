# Hotkeys: Hyper = Control+Option+Command (Caps Lock via Hyperkey.app).
# Any action not listed is unassigned, which also clears OmniWM's Option-key defaults.

# Layout
[[hotkeys]]
id = "toggleWorkspaceLayout" # Dwindle <-> Niri
binding = "Control+Option+Command+Slash"

[[hotkeys]]
id = "toggleFullscreen" # fill the workspace (either layout)
binding = "Control+Option+Command+Comma"

[[hotkeys]]
id = "cycleSizeForward" # Niri: column width 1/3 -> 1/2 -> 2/3
binding = "Control+Option+Command+Period"

[[hotkeys]]
id = "toggleFloatingFocus" # jump to floating windows (Preview, prefs); press again to return
binding = "Control+Option+Shift+Command+Comma"

[[hotkeys]]
id = "balanceSizes"
binding = "Control+Option+Command+0"

# Focus
[[hotkeys]]
id = "focus.left"
binding = "Control+Option+Command+H"

[[hotkeys]]
id = "focus.down"
binding = "Control+Option+Command+J"

[[hotkeys]]
id = "focus.up"
binding = "Control+Option+Command+K"

[[hotkeys]]
id = "focus.right"
binding = "Control+Option+Command+L"

# Move
[[hotkeys]]
id = "move.left"
binding = "Control+Option+Shift+Command+H"

[[hotkeys]]
id = "move.down"
binding = "Control+Option+Shift+Command+J"

[[hotkeys]]
