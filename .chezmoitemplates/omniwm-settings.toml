# OmniWM settings overlay
#
# Merged into ~/.config/omniwm/settings.toml by dot_config/omniwm/modify_settings.toml.
# OmniWM owns the rest of that file and rejects it if any section is missing,
# so only the keys below are managed here:
#   - tables ([general], [gaps], ...) are merged key by key
#   - arrays ([[workspaces]], [[hotkeys]], [[appRules]]) replace OmniWM's entirely
#
# Launch OmniWM once before `chezmoi apply` so it writes its defaults first.
# Docs: https://omniwm.app/config/settings-reference/

[general]
systemHyperTrigger = "None"        # Hyperkey.app already turns Caps Lock into ⌃⌥⌘
defaultLayoutType = "dwindle"      # BSP tiling, closest to Aerospace 'tiles'
workspaceAutoBackAndForth = true   # Hyper+<current workspace> returns to the previous one

# Aerospace: inner 2, outer 0
[gaps]
size = 2.0

[gaps.outer]
top = 0.0
bottom = 0.0
left = 0.0
right = 0.0

# Active window border: Monokai Pro Machine yellow (#FFD76D) to match Ghostty.
# Set enabled = false to drop it entirely.
[borders]
enabled = true
width = 1.0

[borders.color]
red = 1.0
green = 0.843
blue = 0.427
alpha = 0.9

# No workspace bar; the OmniWM menu bar item shows the focused workspace instead (e.g. "T").
# Only the focused monitor's workspace is shown.
[workspaceBar]
enabled = false

[statusBar]
showWorkspaceName = true
showIcon = false

# Clipboard history is handled by Alfred
[clipboard]
historyEnabled = false

# Quake terminal background; 0.1-1.0. Blur (backgroundEffect) only shows when below 1.0
[quakeTerminal]
opacity = 0.9

[scratchpads.labels]
1 = "pad"

# Workspace names must be positive integers; letters live in displayName.
# Letter workspaces start at 10. Hotkey ids are zero-based, so workspace 10 = switchWorkspace.9
#   B=10  E=11  F=12  M=13  N=14  T=15

